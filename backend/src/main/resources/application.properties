# ===================================================================================
# ?? DATABASE CONFIGURATION (Docker Internal Network)
# ===================================================================================
# Defaults to connecting to the Docker container named 'asset-db'
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://asset-db:5432/asset_compass}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===================================================================================
# ?? HIBERNATE SETTINGS
# ===================================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ===================================================================================
# ? SECURITY SETTINGS (Injected via Environment)
# ===================================================================================
jwt.secret=${JWT_SECRET}
app.alphavantage.key=${APP_ALPHAVANTAGE_KEY}

# ===================================================================================
# ?? CONNECTION POOL (Optimized for Local Server)
# ===================================================================================
# Since the DB is on the same machine, we can handle more connections securely
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2